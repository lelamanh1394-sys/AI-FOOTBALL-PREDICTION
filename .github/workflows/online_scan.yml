
name: AI Football Data Engine V3

on:
  workflow_dispatch:

  schedule:
    # 09:00, 15:00, 21:00 and 03:00 Vietnam time
    - cron: "0 2,8,14,20 * * *"

permissions:
  contents: write

concurrency:
  group: football-v3-online-scan
  cancel-in-progress: false

jobs:
  online-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run V3 online scanner
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python online_scanner.py

      - name: Save collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/online/
          if git diff --cached --quiet; then
            echo "No new data to commit."
          else
            git commit -m "V3: collect online fixtures and odds"
            git push
          fi
