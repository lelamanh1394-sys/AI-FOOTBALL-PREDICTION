name: AI Football Prediction V3.3

on:
  workflow_dispatch:

  schedule:
    # 09:00 and 21:00 Vietnam time
    - cron: "0 2,14 * * *"

permissions:
  contents: write

concurrency:
  group: football-v33-public-odds
  cancel-in-progress: false

jobs:
  football-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Collect public football odds
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          python odds_collector.py

      - name: Run V3.3 analysis engine
        run: |
          python v33_engine.py

      - name: Save V3.3 data and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/public_odds/ data/analysis/

          if git diff --cached --quiet; then
            echo "No new data to commit."
          else
            git commit -m "V3.3: collect public odds and analyse matches"
            git push
          fi
